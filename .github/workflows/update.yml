name: Refresh Telugu OTT data

on:
  schedule:
    - cron: "30 1 * * *"   # every day, 7:00 AM IST
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild the whole current year"
        type: boolean
        default: false
      since:
        description: "Backfill from this date, e.g. 2023-01-01 (run once)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest releases
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          FULL: ${{ inputs.full && '1' || '0' }}
          START: ${{ inputs.since }}
        run: node scripts/update.mjs
      - name: Commit changes
        run: |
          git config user.name "ott-bot"
          git config user.email "ott-bot@users.noreply.github.com"
          git add data.json candidates.json
          git diff --cached --quiet || (git commit -m "Update OTT data" && git push)
